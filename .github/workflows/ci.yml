# 主干门禁：仓库卫生与提交规范 + 后端 lint/测试 + 前端 lint/测试/构建
# 触发：PR 合入 main、main 与 feature/** 分支推送、手动触发
# 说明：ci-gate 是汇总作业，远端分支保护只需勾选「CI 全部通过」这一个必选检查
name: CI 门禁

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  detect:
    name: 检测仓库当前包含哪些部分
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.check.outputs.backend }}
      frontend: ${{ steps.check.outputs.frontend }}
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      # 项目主体按批次提交：骨架阶段的 main 里可能还没有 backend/ 或 frontend/，
      # 此时对应作业按"跳过"处理并给出 notice，避免门禁在"还没到那一批"时假红
      - name: 检查各部分入口文件是否存在
        id: check
        run: |
          set -euo pipefail
          if [ -f backend/requirements.txt ]; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
            echo "检测到 backend/requirements.txt，后端检查将执行"
          else
            echo "backend=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=跳过后端检查::仓库当前没有 backend/requirements.txt（该批次尚未提交后端），后端作业按跳过处理"
          fi
          if [ -f frontend/package.json ]; then
            echo "frontend=true" >> "$GITHUB_OUTPUT"
            echo "检测到 frontend/package.json，前端检查将执行"
          else
            echo "frontend=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=跳过前端检查::仓库当前没有 frontend/package.json（该批次尚未提交前端），前端作业按跳过处理"
          fi

  repo-guard:
    name: 仓库卫生与提交规范
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 拉取代码（需要全部历史来校验提交信息）
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: 计算对比基线
        id: base
        run: |
          set -euo pipefail
          base=""
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="origin/${{ github.base_ref }}"
            git rev-parse --verify --quiet "$base" >/dev/null \
              || git fetch --no-tags origin "+refs/heads/${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"
          elif [ "${{ github.event_name }}" = "push" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            base="${{ github.event.before }}"
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "对比基线：${base:-（无，按全量扫描 + 最近一次提交）}"

      - name: 校验检查规则本身
        run: python scripts/ci_check.py --self-test

      - name: 仓库卫生与提交信息自检
        env:
          BASE_REF: ${{ steps.base.outputs.base }}
        run: |
          if [ -n "$BASE_REF" ]; then
            python scripts/ci_check.py --base "$BASE_REF"
          else
            python scripts/ci_check.py
          fi

  backend:
    name: 后端 lint + 测试
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: detect
    if: needs.detect.outputs.backend == 'true'
    defaults:
      run:
        working-directory: backend
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-root-pwd
          MYSQL_ROOT_HOST: "%"
          MYSQL_DATABASE: smart_traffic
        ports:
          - 3306:3306
      redis:
        image: redis:5
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      DB_NAME: smart_traffic
      DB_USER: root
      DB_PASSWORD: ci-root-pwd
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: "6379"
      REDIS_DB: "15"
      JWT_SECRET: ci-only-secret-please-do-not-reuse-0123456789
      MOCK_DATA_ENABLED: "false"
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: 安装 OpenCV 运行库（Linux 需要 libGL）
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0

      - name: 安装后端依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 等待 MySQL 就绪
        run: |
          python - <<'PY'
          import os
          import time

          import pymysql

          deadline = time.time() + 90
          last_error = None
          while time.time() < deadline:
              try:
                  conn = pymysql.connect(
                      host=os.environ["DB_HOST"],
                      port=int(os.environ["DB_PORT"]),
                      user=os.environ["DB_USER"],
                      password=os.environ["DB_PASSWORD"],
                      connect_timeout=3,
                  )
                  conn.close()
                  print("MySQL 已就绪")
                  raise SystemExit(0)
              except Exception as exc:  # 容器启动期连接失败属正常现象，重试即可
                  last_error = exc
                  time.sleep(3)
          print(f"MySQL 90 秒内未就绪：{last_error}")
          raise SystemExit(1)
          PY

      - name: ruff 静态检查
        run: ruff check .

      - name: pytest（独立测试库 smart_traffic_test）
        run: pytest -q

  frontend:
    name: 前端 lint + 测试 + 构建
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: detect
    if: needs.detect.outputs.frontend == 'true'
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装前端依赖
        run: npm ci

      - name: eslint 静态检查
        run: npm run lint

      - name: vitest 单元测试
        run: npm run test

      - name: 构建校验
        run: npm run build

  ci-gate:
    name: CI 全部通过
    runs-on: ubuntu-latest
    needs: [repo-guard, detect, backend, frontend]
    if: always()
    steps:
      - name: 汇总上游作业结果
        run: |
          echo "repo-guard=${{ needs.repo-guard.result }}"
          echo "detect=${{ needs.detect.result }}（后端存在=${{ needs.detect.outputs.backend }}，前端存在=${{ needs.detect.outputs.frontend }}）"
          echo "backend=${{ needs.backend.result }}"
          echo "frontend=${{ needs.frontend.result }}"
          if [ "${{ contains(needs.*.result, 'failure') }}" = "true" ] || [ "${{ contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "存在未通过的检查，禁止合并"
            exit 1
          fi
          echo "全部门禁检查通过（skipped 表示该批次还没有这部分代码，属预期）"
