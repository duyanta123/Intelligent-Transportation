# 安全扫描：密钥泄露（阻断）+ 依赖漏洞审计（提示，不阻断合并）
# 触发：PR 合入 main、main 推送、每周一 06:00（北京时间）定时全量扫描、手动触发
name: 安全扫描

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 22 * * 0"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  secret-scan:
    name: 密钥泄露扫描
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 拉取代码（含全部历史）
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # 个人账号免费；组织账号需在仓库 Secrets 中配置 GITLEAKS_LICENSE
      - name: gitleaks 扫描
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  dependency-audit:
    name: 依赖漏洞审计（提示）
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - name: 拉取代码
        uses: actions/checkout@v7

      - name: 安装 Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: 安装 Node 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 后端依赖审计（pip-audit）
        if: hashFiles('backend/requirements.txt') != ''
        run: |
          python -m pip install --quiet pip-audit
          pip-audit -r backend/requirements.txt --progress-spinner off || echo "::warning::pip-audit 报告了依赖漏洞，请人工评估（本作业不阻断合并）"

      - name: 前端依赖审计（npm audit）
        if: hashFiles('frontend/package.json') != ''
        run: |
          cd frontend
          npm audit --audit-level=high --omit=dev || echo "::warning::npm audit 报告了依赖漏洞，请人工评估（本作业不阻断合并）"
